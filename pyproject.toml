[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scopepilot"
version = "0.1.0"
description = "Local brief ingestion foundation for ScopePilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.5",
    "SQLAlchemy==2.0.41",
    "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scopepilot"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

